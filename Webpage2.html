<!DOCTYPE html>
<html lang=“en”>

<head>
    <title>Web page 2</title>
</head>

<body>
    <form>
        <h1>my 2nd webpage</h1>
        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname"><br>
        <label for="myemail">Email:</label><br>
        <input type="email" id="myemail" name="myemail"><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="10" cols="100"
            placeholder="Enter your message here..."></textarea><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>

</html>
