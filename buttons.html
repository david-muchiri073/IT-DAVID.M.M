<style>
    .subscribe-button {
        background-color: blue;
        color: red;
        border: none;
        height: 37px;
        width: 90px;
        border-radius: 3px;
        cursor: pointer;
        margin-right: 9px;
        transition: opacity 0.15s;
    }

    .subscribe-button:hover {
        background-color: orange;
        opacity: 0.8;
    }

    .subscribe-button:active {
        background-color: green;
    }

    .join-button {
        background-color: #ffff00;
        border-color: blueviolet;
        border-style: solid;
        border-width: 2px;
        color: aqua;
        height: 36px;
        width: 70px;
        border-radius: 3px;
        cursor: pointer;



        .tweet-button {
            background-color: grey;
            color: black;
            border: none;
            height: 40px;
            width: 70px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 15;
            margin-left: 20px;


        }
</style>

<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">TWEET</button>
